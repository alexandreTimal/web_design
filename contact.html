<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Alexandre Timal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <h1>Contact</h1>
    <p>Get in touch with me using the form below.</p>
  </header>

  <nav id="main-nav"></nav>
  <script src="nav.js"></script>

  <main id="main-content">
    <section>
      <h2>Contact form</h2>
      <form id="contactForm" method="post" action="#" aria-label="Contact form">
        <fieldset>
          <legend>Your details</legend>

          <label for="fullname">Full name (required)</label>
          <input type="text" id="fullname" name="fullname">

          <label for="email">Email (required)</label>
          <input type="email" id="email" name="email">

          <label for="phone">Phone (optional, 10 digits)</label>
          <input type="text" id="phone" name="phone">

          <label for="dob">Date of birth</label>
          <input type="date" id="dob" name="dob">

          <label for="age">Age</label>
          <input type="number" id="age" name="age">

          <label for="website">Website URL</label>
          <input type="url" id="website" name="website">

          <label for="fileUpload">File upload (.pdf or .docx, max 2MB)</label>
          <input type="file" id="fileUpload" name="fileUpload">

          <label for="favColor">Favorite color</label>
          <input type="color" id="favColor" name="favColor">
        </fieldset>

        <fieldset>
          <legend>Your message</legend>

          <label for="subject">Subject (required)</label>
          <select id="subject" name="subject">
            <option value="">-- Choose a subject --</option>
            <option value="general">General question</option>
            <option value="project">Project collaboration</option>
            <option value="other">Other</option>
          </select>

          <label for="message">Message (required)</label>
          <textarea id="message" name="message" rows="5"></textarea>
        </fieldset>

        <fieldset>
          <legend>How did you hear about me?</legend>

          <input type="radio" id="hear-course" name="hear" value="course">
          <label for="hear-course">Course / university</label>

          <input type="radio" id="hear-search" name="hear" value="search">
          <label for="hear-search">Search / web</label>

          <input type="radio" id="hear-friend" name="hear" value="friend">
          <label for="hear-friend">Friend</label>
        </fieldset>

        <button type="submit">Send message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Alexandre Timal &middot; Web Design &middot; 2026</p>
  </footer>

  <script src="contact.js"></script>
</body>
</html>
