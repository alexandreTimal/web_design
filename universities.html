<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universities - Alexandre Timal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <h1>Universities</h1>
    <p>Public list of universities in Romania (fetched from Hipolabs API).</p>
  </header>

  <nav id="main-nav"></nav>
  <script src="nav.js"></script>

  <main id="main-content">
    <section>
      <h2>Universities in Romania</h2>

      <label for="q">Filter (optional):</label>
      <input type="text" id="q" placeholder="search by name…">

      <button id="exportCsv">Export CSV</button>

      <p id="status"></p>

      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Country</th>
            <th>Website</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>Alexandre Timal &middot; Web Design &middot; 2026</p>
  </footer>

  <script src="universities.js"></script>
</body>
</html>
